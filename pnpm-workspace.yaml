packages:
  - "packages/*"
  - "apps/*"
  # 拓展(ADR-0012 决策 4)。住本仓、workspace 引类型 —— 契约改一格,所有拓展
  # 当场编译不过,`vp run typecheck` 一跑清单就出来了。发版用 tag 前缀分开。
  - "extensions/*"

# The pnpm version lives in package.json#packageManager (vp reads it and fetches
# that pnpm on demand); nothing here pins it. Two things to know when bumping it:
#   1. Since pnpm 12, `pnpm-lock.yaml` is TWO YAML documents. The first one is
#      pnpm describing ITSELF — `packageManagerDependencies` plus a `@pnpm/exe.*`
#      entry per platform, with integrity hashes. So a pnpm bump now shows up as
#      a lockfile diff; that is expected, not drift. It is a record only, nothing
#      gets materialized in node_modules.
#   2. pnpm 12 errors on unknown keys here (ERR_PNPM_UNRECOGNIZED_WORKSPACE_
#      SETTINGS) instead of silently ignoring them, so a typo'd setting fails the
#      install rather than quietly doing nothing. Every key in this file is valid
#      as of 12.18.0.

# Vite+ replaces vite via npm overrides rather than coexisting. The override is
# scoped to each React frontend sub-tree — `@bilibili-notify/web>vite` matches
# "vite" anywhere reachable from that dep graph (so @vitejs/plugin-react,
# @tailwindcss/vite etc. all fall under it) — instead of the README's global
# `vite:` form, so that nothing outside the frontends (vitest inside vite-plus,
# vp pack) gets its vite silently swapped by a side effect. scripts/__tests__/vite-alias.test.mjs
# pins the invariant the overrides exist for: every frontend resolves bare `vite`
# to the Vite+ core, on one version. A missing override is silent otherwise —
# real vite also builds and tests fine, and only misbehaves at runtime.
#
# Bumping vite-plus? Two things move in lockstep, and missing either one
# silently leaves half the toolchain on the old version:
#   1. root `vite-plus` + `@voidzero-dev/vite-plus-core` devDeps
#   2. the overrides below (else the React frontends keep the old core)
# Everything else follows 1 by itself: CI's setup-vp installs that vp version,
# and the image build passes it to apps/Dockerfile as `VP_BUILDER_IMAGE`
# (.github/actions/build-push-image-digest), so the builder runs the same vp as
# everywhere else. The Dockerfile's own default is the major floating tag, for
# local `docker build` only: edit it on a major bump
# (scripts/__tests__/vp-builder-image.test.mjs catches a miss). setup-vp itself
# is pinned by exact tag (see gate.yml). A major bump also moves the
# `peerDependencyRules` ranges below, which name the core's major.
# Also: upgrade the global vp CLI FIRST (`vp upgrade`), then edit these
# declarations — installing a newer vite-plus package with an older CLI has
# corrupted the lockfile before (biome's entry took on vite-plus's resolution).
# vitest is not declared at the root: vite-plus pins it exactly and brings its
# own copy; a root declaration on a different version would install a second
# vitest, and @vitest/spy would then have two identities (mocks stop matching,
# which surfaces as absurd test failures, not as a version error).
#
# pnpm's release-age floor defaults to 1440 min = 1 DAY. The exact 1.5.1
# exclusions below were added by pnpm on 2026-11-10 because that release was
# still under 24 hours old when explicitly adopted. Include the core and all
# platform binaries, not just `vite-plus`; do not carry these entries forward
# when bumping to a release that already clears the age floor.
overrides:
  "@bilibili-notify/web>vite": "npm:@voidzero-dev/vite-plus-core@1.5.1"
  "@bilibili-notify/desktop>vite": "npm:@voidzero-dev/vite-plus-core@1.5.1"

# The core alias reports its own version (1.x) to pnpm, not the vite it bundles
# (8.x), so every consumer with a `vite` peer range sees an unmet peer. Upstream's
# answer is a blanket `allowAny: [vite]` (vite-plus issue 1021; issue 2806 asks
# for something stricter). Allowing the core's major for the four consumers we
# actually have keeps the check alive for anything new: a new vite plugin still
# warns, and that is the prompt to check it against the bundled vite before
# adding it here.
peerDependencyRules:
  allowedVersions:
    "vitest>vite": "1"
    "@vitest/mocker>vite": "1"
    "@tailwindcss/vite>vite": "1"
    "@vitejs/plugin-react>vite": "1"

# Shared dependency versions. Every package declares these as `"<dep>": "catalog:"`;
# the version lives only here, so a bump is one edit and per-package drift (the
# historical @types/ws ^8.5 / ^8.18 split, desktop's vite alias stuck on 0.2.8)
# cannot recur.
#
# One deliberate exclusion: vite stays out. The React frontends pin it through the
# overrides above as part of the vite-plus lockstep (see that comment); a second
# source of truth in the catalog would reintroduce the drift the overrides exist
# to prevent.
catalog:
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.1
  "@types/luxon": ^3.7.5
  "@types/qrcode": ^1.5.6
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@types/ws": ^8.18.1
  "@vitejs/plugin-react": ^6.1.0
  cron: ^4.4.0
  cross-env: ^10.1.0
  fflate: ^0.8.3
  jsdom: ^30.0.1
  luxon: ^3.5.0
  puppeteer-core: ^25.9.0
  qrcode: ^1.5.4
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  tldts: 7.4.11
  tsx: ^4.23.12
  undici: ^8.10.0
  ws: ^8.21.3
  zod: ^4.4.3

# pnpm 11+ makes postinstall opt-in by default to mitigate supply-chain
# risk. Each entry below is a transitive dep that ships a build script.
# All four are widely-used, well-known packages whose postinstalls are
# benign (native binary builds + git-hook installer). Re-evaluate when
# bumping versions; CI fails install if a *new* unapproved entry appears.
allowBuilds:
  "@parcel/watcher": true # native fsevents/inotify shim used by vite watcher
  esbuild: true # downloads matching native binary
  lefthook: true # repo's git hooks installer (root prepare script)
  protobufjs: true # generates .js from .proto at install time

patchedDependencies:
  css-tree: patches/css-tree.patch

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.5.1"
  - "@voidzero-dev/vite-plus-darwin-x64@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.5.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1"
  - vite-plus@1.5.1
