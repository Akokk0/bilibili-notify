name: Gate

# **发版门禁**的唯一定义:Biome → build → typecheck → test。
# CI、Docker、Desktop、npm与应用内更新全部复用它。
#
# 抽出来是因为门禁是「这份代码能不能发出去」的判据 —— 各自维护的副本迟早会飘,
# 而飘的方式一定是某条发布路径悄悄少了一项检查,且没人发现(发布 workflow 全绿)。
# 加一条新检查时只改这里一处,所有路径同时生效。
#
on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs Vite+ (vp) globally at the version the root `vite-plus`
      # devDependency names (setup-vp reads it by itself), the repo-pinned Node
      # from .node-version, and runs `vp install`. On GitHub Actions CI=true →
      # the underlying pnpm install is frozen-lockfile automatically (= old
      # `pnpm install --frozen-lockfile`). `cache: true` keys off pnpm-lock.yaml.
      # Every workflow pins setup-vp to an exact tag: its floating `v1` tag
      # stopped at 1.15.0, before the install script was pinned to the requested
      # vp version (1.18) and Windows cache links were restored correctly (1.21).
      - name: Setup Vite+ (vp) + Node + deps
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Lint (Biome)
        run: vp exec biome ci .

      # `vpr <script>` 是 vp 的 shim 简写,等价 `vp run <script>`,从 root
      # package.json scripts 入口走。build 内部是 `pnpm -r run build`;vp 把内嵌
      # pnpm 注入子进程 PATH 让 legacy script body 继续 work(packages/* vp pack +
      # apps/server vp pack + apps/web Vite)。typecheck 与 test 同模式。
      - name: Build
        run: vpr build

      - name: Typecheck
        run: vpr typecheck

      - name: Test
        run: vpr test

      # 与四种面板语言均不同的默认数字/日期格式，防止遗漏 locale 又静默通过。
      - name: Test panel formatting with Arabic host locale
        env:
          LANG: ar_EG.UTF-8
          LC_ALL: ar_EG.UTF-8
        run: vp run test apps/web/src/pages/__tests__/overview-health-details.test.tsx apps/web/src/pages/__tests__/ExtensionDetail.report-discrepancies.test.tsx -t '核心计数悬停值|上报时间悬停值' --reporter=dot
