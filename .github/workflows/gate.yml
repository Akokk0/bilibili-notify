name: Gate

# **发版门禁**的唯一定义:Biome → build → typecheck → test。
# ci.yml / image-release.yml / desktop-release.yml 全部复用它。
#
# 抽出来是因为门禁是「这份代码能不能发出去」的判据 —— 三份各自维护的副本迟早会飘,
# 而飘的方式一定是某条发布路径悄悄少了一项检查,且没人发现(发布 workflow 全绿)。
# 加一条新检查时只改这里一处,三条路径同时生效。
#
on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Installs Vite+ (vp) globally, the repo-pinned Node from .node-version,
      # and runs `vp install`. On GitHub Actions CI=true → the underlying pnpm
      # install is frozen-lockfile automatically (= old `pnpm install
      # --frozen-lockfile`). `cache: true` keys off pnpm-lock.yaml.
      - name: Setup Vite+ (vp) + Node + deps
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true

      - name: Lint (Biome)
        run: vp exec biome ci .

      # `vpr <script>` 是 vp 的 shim 简写,等价 `vp run <script>`,从 root
      # package.json scripts 入口走。build 内部是 `pnpm -r run build`;vp 把内嵌
      # pnpm 注入子进程 PATH 让 legacy script body 继续 work(packages/* vp pack +
      # apps/server vp pack + apps/web Vite)。typecheck 与 test 同模式。
      - name: Build
        run: vpr build

      - name: Typecheck
        run: vpr typecheck

      - name: Test
        run: vpr test
