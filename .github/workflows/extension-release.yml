name: bilibili-notify — extension release

# 发一个拓展(ADR-0013):tag `extension/<id>@<version>` 触发 —— 构建那个拓展、打成拓展包、
# 挂到一个**不可变**的 release(同名 tag)上,然后把这一条并进官方索引、重签、覆盖到滚动的
# `extensions` release 上。拓展与本体分开发布,所以这条流水线与 update-payload
# 各管各的 release,不排同一把锁。
#
# 版本不像本体那样按 tag 临时改元数据:拓展是独立发布物,清单里的版本就该是真的 ——
# tag 与 extensions/<id>/extension.json 对不上直接红(assert-extension-tag.sh)。

on:
  push:
    tags:
      - "extension/*@*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign only, skip creating the release and publishing the index"
        type: boolean
        default: true
      id:
        description: "Extension id for dry-run builds, e.g. bridge"
        required: true
      version:
        description: "Version declared in extensions/<id>/extension.json, e.g. 0.0.1"
        required: true

concurrency:
  group: extensions-index
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  gate:
    if: startsWith(github.ref, 'refs/tags/extension/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.dry_run)
    uses: ./.github/workflows/gate.yml

  publish:
    name: Build + publish extension
    needs: [gate]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/extension/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && inputs.dry_run)

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert tag matches the extension manifest
        id: ext
        env:
          EXT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.id || '' }}
          EXT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: bash .github/scripts/extension-release/assert-extension-tag.sh

      - name: Assert release commit is on dev
        if: startsWith(github.ref, 'refs/tags/extension/')
        run: bash .github/scripts/shared/assert-release-ref-on-dev.sh

      - name: Setup Vite+ (vp) + Node
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true

      - name: Install deps
        run: vp install

      # 条目上那句 notes 从 extensions/<id>/CHANGELOG.md 该版本段的概述抽 —— 与本体同一套规矩、
      # 同一个脚本。抽不出来在这儿就红,别等构建跑完。
      - name: Read release summary from the extension CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.ext.outputs.version }}
          CHANGELOG_FILE: extensions/${{ steps.ext.outputs.id }}/CHANGELOG.md
        run: bash .github/scripts/shared/read-release-summary.sh

      - name: Build the extension
        env:
          ID: ${{ steps.ext.outputs.id }}
        run: vp run -F "@bilibili-notify/extension-${ID}" build

      # 产出的 path / sha256 / size 供后面上传 release 与并进索引用;资产名怎么定见脚本头。
      - name: Pack the extension package
        id: pkg
        env:
          ID: ${{ steps.ext.outputs.id }}
        run: bash .github/scripts/extension-release/pack-extension.sh

      # 官方索引与升级清单用同一把私钥。没配就整条跳过并打 warning —— 同 update-payload。
      - name: Assert signing key
        id: key
        env:
          BN_UPDATE_SIGNING_KEY: ${{ secrets.BN_UPDATE_SIGNING_KEY }}
        run: bash .github/scripts/extension-release/assert-extension-signing-key.sh

      - name: Validate release token
        if: env.DRY_RUN == 'false' && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: bash .github/scripts/shared/validate-release-token.sh

      # 包先于索引上传:索引一旦发布就有客户端来拉,它指的包必须已经在。
      - name: Create the extension release and upload the package
        if: env.DRY_RUN == 'false' && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          ID: ${{ steps.ext.outputs.id }}
          VERSION: ${{ steps.ext.outputs.version }}
          PRERELEASE: ${{ steps.ext.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.value }}
          PACKAGE_PATH: ${{ steps.pkg.outputs.path }}
        run: bash .github/scripts/extension-release/create-extension-release.sh

      # 当前索引:滚动 release 上的信封 → 取出本体。**只有 release 还不存在**才当第一次发 ——
      # 别的失败当场红,详见脚本头。
      - name: Fetch the current marketplace index
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: bash .github/scripts/extension-release/fetch-marketplace-index.sh

      - name: Merge this entry and sign the index
        if: steps.key.outputs.present == 'true'
        env:
          BN_UPDATE_SIGNING_KEY: ${{ secrets.BN_UPDATE_SIGNING_KEY }}
          ID: ${{ steps.ext.outputs.id }}
          VERSION: ${{ steps.ext.outputs.version }}
          PRERELEASE: ${{ steps.ext.outputs.prerelease }}
          REPO: ${{ github.repository }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
          SIZE: ${{ steps.pkg.outputs.size }}
          NOTES: ${{ steps.notes.outputs.value }}
        run: bash .github/scripts/extension-release/sign-extension-index.sh

      - name: Publish the marketplace index
        if: env.DRY_RUN == 'false' && steps.key.outputs.present == 'true'
        env:
          FILE: dist/marketplace-next.sig.json
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/extension-release/publish-extension-marketplace.sh
