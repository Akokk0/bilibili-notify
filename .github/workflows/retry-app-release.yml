name: bilibili-notify — retry macOS release runner

on:
  workflow_run:
    workflows: ["bilibili-notify — app release"]
    types: [completed]

permissions: {}

concurrency:
  group: retry-app-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry macOS runner allocation
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # github.sha 是默认分支提交。发行作业的产物和代码均不进入这个获写权限的作业。
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/retry-app-release.mjs
          sparse-checkout-cone-mode: false

      - name: Check runner allocation and request a job rerun
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/retry-app-release.mjs
