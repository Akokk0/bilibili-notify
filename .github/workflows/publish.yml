name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm --provenance 走 OIDC,需要 id-token。
      id-token: write

    steps:
      - uses: actions/checkout@v6

      # 装 vp + 仓库钉住的 Node(.node-version)+ 跑 `vp install`(CI 上 frozen)。
      # registry-url 让 setup-vp 写出 ~/.npmrc 的
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,下面的 publish 步骤
      # 靠它认证。
      - name: Setup Vite+ (vp) + Node + deps
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          registry-url: "https://registry.npmjs.org"

      - name: Lint (Biome)
        run: vp exec biome ci .

      - name: Build
        run: vp run build

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp test

      # 发 koishi 插件。scripts/publish.mjs 从 koishi/package.json 的 version 推导
      # dist-tag(5.0.0-alpha.9 → alpha;5.0.0 → latest),并在发布前问一次 registry:
      # 版本已存在就安静跳过 —— push main 不一定意味着版本变了。
      #
      # 这里不再需要 changesets/action,也不再需要 corepack:registry 上只剩这一个包
      # 要发(内部包已 private + 被内联),且它的 dependencies 里没有 `workspace:*`,
      # 所以直接用 vp 自带 Node 的 npm 即可。
      - name: Publish to npm
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
