name: Publish

on:
  push:
    # dev 只做独立端了;koishi 4 上的维护版本(5.2.1 起)从 koishi-maintenance 发。
    branches: [dev, koishi-maintenance]
    # 粗筛:version 只可能写在这个文件里。但**文件变了 ≠ 要发版** —— `vp pack`
    # (exports: true)会自动回写它的 `inlinedDependencies` / `exports`,每次构建都可能
    # 刷新。真正的判定在 detect job,只认 version 字段本身。
    paths:
      - "koishi/package.json"

  # 手动补发。用于「版本号已经推上去了,但那次 gate 红了」这类卡死:push 触发只认
  # version **变动**,修完再 push 时版本号相对上一次没变,自动触发就永远不会再来一次,
  # 只能靠往前跳一个版本号绕过。
  #
  # detect 与 koishi-version-changed.mjs 都不用改:dispatch 时 `github.event.before`
  # 求值为空串,脚本的 versionAt("") 返回 null,decide 对 `before === null` 本来就是
  # 「拿不到基线 —— 放行,交给 registry 幂等把关」。误发那条路已被 publish.mjs 的
  # registry 查询堵死(版本已存在就安静跳过),所以手动触发是安全的。
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 快速门:版本号没动就别启动整条 CI(lint + build + typecheck + test 是分钟级的)。
  # 这**不是**安全闸 —— workflow 被重跑时 github.event.before 还是老的,这里照样判
  # changed。兜底的是 publish 步骤里 scripts/publish.mjs 的 registry 幂等。
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 要 `git show` 到 push 之前的那个 commit,浅克隆里没有它。
          fetch-depth: 0

      # 脚本只用 node 内置 API,runner 自带的 node 就够 —— 这一步不装 vp,省几十秒。
      - name: Gate on koishi version change
        id: gate
        run: node scripts/koishi-version-changed.mjs "${{ github.event.before }}"

  # 门禁(gate.yml 是唯一定义)。红了 publish 就不会跑 —— 发出去的东西一定过了门禁。
  gate:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    # 本 workflow 没有顶层 permissions,别让被调用方去赌默认值 —— gate 只需要 checkout。
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml

  publish:
    needs: [detect, gate]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm --provenance 走 OIDC,需要 id-token。
      id-token: write

    steps:
      - uses: actions/checkout@v6

      # 装 vp + 仓库钉住的 Node(.node-version)+ 跑 `vp install`(CI 上 frozen)。
      # registry-url 让 setup-vp 写出 ~/.npmrc 的
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,下面的 publish 步骤
      # 靠它认证。
      - name: Setup Vite+ (vp) + Node + deps
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .node-version
          cache: true
          registry-url: "https://registry.npmjs.org"

      # **别删这一步**,它不是 gate 里那个 build 的重复:npm 打包的是 `koishi/lib/`
      # (gitignored,只在构建时生成),而 gate 跑在**另一个 runner** 上,产物带不过来。
      # 没有这一步,发出去的就是个空壳包。gate 里的 build 是门禁(编译得过),
      # 这里的 build 是产物。
      - name: Build (produces koishi/lib for npm)
        run: vp run build

      # 发 koishi 插件。scripts/publish.mjs 从 koishi/package.json 的 version 推导
      # dist-tag(5.0.0-alpha.9 → alpha;5.0.0 → latest),并在发布前问一次 registry:
      # 版本已存在就安静跳过。detect 已经挡掉了「版本没变」,这一层挡的是**同一次 push
      # 的 workflow 被重跑** —— 那时 before 还是老的,detect 会再次判 changed。
      #
      # 这里不再需要 changesets/action,也不再需要 corepack:registry 上只剩这一个包
      # 要发(内部包已 private + 被内联),且它的 dependencies 里没有 `workspace:*`,
      # 所以直接用 vp 自带 Node 的 npm 即可。
      - name: Publish to npm
        run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
