name: bilibili-notify — test image

# 一次性手动测试构建:只推 Docker(完全不碰 Desktop / 不需要 git tag / 不驱动任何
# 正式发版流水线),打**浮动** `:test` tag —— 每次跑都会覆盖上一次,不进
# `:latest` / `:alpha` / `:v<VERSION>` 那套不可变体系,可以随便重跑、随便扔。
#
# 用途:验证某次 Docker 相关改动(Dockerfile / base 镜像 / 打包方式)在真实
# `docker pull` 场景下能不能正常拉取、启动,不代表任何正式发版。
#
# 默认只建 amd64(单 arch,直接 push,无需 digest+merge 那套多 registry 拼装)。
# 需要同时验证 arm64 时手动把 platforms 填 "linux/amd64,linux/arm64" —— 但
# 注意这会在 x86 runner 上用 QEMU 模拟 arm64,vp pack/vite 等 native 二进制
# 在模拟环境下慢 10-20 倍(image-release.yml 的 split-runner 架构就是为了避开
# 这个,单次测试没必要跟进那套复杂度,能接受更慢就直接选双 arch)。
#
# Required repo secret: DOCKERHUB_TOKEN(同 image-release)。GHCR 用 GITHUB_TOKEN。

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platforms (multi-arch uses slow QEMU emulation)"
        type: string
        default: "linux/amd64"

concurrency:
  group: test-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: docker.io/akokk0/bilibili-notify
  GHCR_IMAGE: ghcr.io/akokk0/bilibili-notify

jobs:
  build:
    name: Build & push :test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: akokk0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 单 arch(默认)时 buildx 直接单次 build+push 打友好 tag,不需要
      # image-release 那套 digest-per-arch + 后置 merge job 的复杂度。
      - name: Build + push test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:test
            ${{ env.GHCR_IMAGE }}:test

      - name: Print pull instructions
        run: |
          echo "### 可以拉取测试了 🐾" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
