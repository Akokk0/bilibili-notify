# 启动 BN 最新正式版。将此文件复制为 docker-compose.yaml，再执行 docker compose up -d。
# 不要手动创建 ./config/bn.config.yaml;容器首次启动会自动生成完整配置。
# 首启动后改配置请编辑 ./config/bn.config.yaml 再 docker compose restart。
#
# 更新:docker compose pull && docker compose up -d(restart 不会换镜像,必须 up -d)。
# pull 时提示 "Layer already exists" 是正常的层复用,不代表没更新。
# 若镜像加速站仍缓存旧版 :latest，可以直接从 Docker Hub 或 GHCR 拉取。
#
# 内存:full 镜像内置 chromium,出图那一下峰值不低,建议宿主可用内存 >= 1GB。
# 只有 512MB 的主机请改用 :slim + 远程浏览器（见下方 browser 服务），否则渲染
# 时容易被系统 OOM 杀掉 —— 表现为「隔几分钟断线重连、卡片预览转半天报错」。
# 排查:docker inspect bilibili-notify --format '{{.RestartCount}} {{.State.OOMKilled}}'
#
# 反向代理:卡片渲染是串行的,一次要出几张图时单个请求可能跑十几秒。nginx 等
# 代理的读超时(proxy_read_timeout)请调到 120s 以上,否则请求会被代理掐断,
# 而服务端那边其实渲染成功了 —— 两边对不上,很难查。

services:
  bilibili-notify:
    image: akokk0/bilibili-notify:latest
    # GHCR 改用 image: ghcr.io/akokk0/bilibili-notify:latest
    # 本地构建改用:build: { context: .., dockerfile: apps/Dockerfile }
    #
    # 省内存方案使用 :slim 正式版镜像，体积与内存占用更小。
    # 需要渲染卡片时，取消 BN_CHROME_ENDPOINT 与下方 browser 服务的注释。
    # 缺少可用的浏览器时，BN 发送文字推送。
    container_name: bilibili-notify
    restart: unless-stopped
    # 停容器时等它收尾的时长。服务端关停最多 8 秒(落盘、关连接),到点才 SIGKILL。
    stop_grace_period: 10s
    ports:
      - "8787:8787"
      # 用 OneBot 反向 WS 连接时,把它的监听端口也映射出来,如 "9797:9797"
    environment:
      # BN_* 仅首启动 seed 进 yaml;之后改值请编辑 ./config/bn.config.yaml
      BN_LOG_LEVEL: info
      # 首次启动自动生成 admin 和随机密码。用 docker compose logs bilibili-notify 查看。
      # BN_COOKIE_KEY: ""          # secrets 加密密钥,openssl rand -base64 32
      # BN_CHROME_ENDPOINT: ws://browser:3000?token=change-me-browser-token
      # BN_CHROME_IDLE_SECONDS: "300"  # 渲染空闲多久后关浏览器省内存;0=常驻
    volumes:
      - ./data:/data              # 运行时状态
      - ./config:/config          # 只挂目录;bn.config.yaml 由容器自动生成
    # depends_on: [napcat]

  # 可选远程浏览器伴随容器(配 -slim 镜像用;full 镜像不需要)。
  # token 与上面 BN_CHROME_ENDPOINT 的 ?token= 保持一致。
  # browser:
  #   image: ghcr.io/browserless/chromium:latest
  #   container_name: bn-browser
  #   restart: unless-stopped
  #   environment:
  #     - TOKEN=change-me-browser-token
  #   # 无需对外暴露端口,仅 compose 内网供 bilibili-notify 访问

  # 可选 NapCat 边车(OneBot v11);WebUI http://<host>:6099 配 QQ 账号
  # napcat:
  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   ports:
  #     - "6099:6099"
  #   volumes:
  #     - ./napcat-config:/app/napcat/config
  #     - ./napcat-cache:/app/.config/QQ
  #   environment:
  #     - ACCOUNT=your_qq_number
