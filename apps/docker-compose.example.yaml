# 用法:cp docker-compose.example.yaml docker-compose.yaml && docker compose up -d
# 不要手动创建 ./config/bn.config.yaml;容器首次启动会自动生成完整配置。
# 首启动后改配置请编辑 ./config/bn.config.yaml 再 docker compose restart。
#
# 更新:docker compose pull && docker compose up -d(restart 不会换镜像,必须 up -d)。
# pull 时提示 "Layer already exists" 是正常的层复用,不代表没更新。
# 若走镜像加速站,:alpha/:latest 浮动 tag 的 manifest 可能被站方缓存导致
# 短时间拉不到新版 —— 改用固定版本 tag(如 :v0.1.0-alpha.13)或直连官源即可。

services:
  bilibili-notify:
    image: akokk0/bilibili-notify:alpha
    # GHCR 改用:image: ghcr.io/akokk0/bilibili-notify:alpha
    # 本地构建改用:build: { context: .., dockerfile: apps/Dockerfile }
    #
    # 省内存方案:-slim 变体(如 :alpha-slim / :slim)不内置 chromium,体积与内存
    # 都小得多;卡片渲染改由下方 browser 伴随容器承担 —— 换 slim 镜像后解开
    # BN_CHROME_ENDPOINT 与 browser 服务的注释即可。不配远程浏览器也能跑,
    # 只是卡片图片渲染退化为文字推送。
    container_name: bilibili-notify
    restart: unless-stopped
    ports:
      - "8787:8787"
      # 用 OneBot 反向 WS 适配器时,把它的监听端口也映射出来,如 "9797:9797"
    environment:
      # BN_* 仅首启动 seed 进 yaml;之后改值请编辑 ./config/bn.config.yaml
      BN_LOG_LEVEL: info
      # dashboard 登录凭据;首启动后请改掉默认密码。删掉这两行则自动生成随机密码
      BN_DASHBOARD_USER: admin
      BN_DASHBOARD_PASS: change-me-on-first-boot
      # BN_COOKIE_KEY: ""          # secrets 加密密钥,openssl rand -base64 32
      # BN_CHROME_ENDPOINT: ws://browser:3000?token=change-me-browser-token
      # BN_CHROME_IDLE_SECONDS: "300"  # 渲染空闲多久后关浏览器省内存;0=常驻
    volumes:
      - ./data:/data              # 运行时状态
      - ./config:/config          # 只挂目录;bn.config.yaml 由容器自动生成
    # depends_on: [napcat]

  # 可选远程浏览器伴随容器(配 -slim 镜像用;full 镜像不需要)。
  # token 与上面 BN_CHROME_ENDPOINT 的 ?token= 保持一致。
  # browser:
  #   image: ghcr.io/browserless/chromium:latest
  #   container_name: bn-browser
  #   restart: unless-stopped
  #   environment:
  #     - TOKEN=change-me-browser-token
  #   # 无需对外暴露端口,仅 compose 内网供 bilibili-notify 访问

  # 可选 NapCat 边车(OneBot v11);WebUI http://<host>:6099 配 QQ 账号
  # napcat:
  #   image: mlikiowa/napcat-docker:latest
  #   container_name: napcat
  #   restart: unless-stopped
  #   ports:
  #     - "6099:6099"
  #   volumes:
  #     - ./napcat-config:/app/napcat/config
  #     - ./napcat-cache:/app/.config/QQ
  #   environment:
  #     - ACCOUNT=your_qq_number
